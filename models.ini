# ──────────────────────────────────────────────────────────
# Caption — archive backfill of Discord image attachments
# (history-service/image_captioner.py). The qwen3.6-27b-u weights and
# projector, as their own preset so the proxy ranks it as batch work
# (BATCH_MODELS, arbiter job llm-batch): ~42k archived images is a day or
# more of GPU time that must always yield to a person.
# Thinking off and a small context: one image (400–1400 prompt tokens
# measured) and one instruction. Measured 2026-11-12 on real archive images: 2–4 s each warm.
# The 12B mimic base would be cheaper, but its projector needs a newer
# llama.cpp — see [gemma4-12b-mimic-u].
