# ============================================================
# llama-server Model Presets — Swappable Slot (:11434)
# ============================================================
# Used with: llama-server --models-preset models.ini
#
# Each [section] defines a named model available via the router.
# The router loads a model into VRAM on first request and evicts
# it when a different model is requested (swap-on-demand).
#
# Model files live at: /srv/models/<publisher>/<model>/filename.gguf
# Download all GGUFs with: make models-download
#
# Parameter reference:
#   model           = path to GGUF file
#   alias           = name used in API requests (model field)
#   n-gpu-layers    = -1 to offload all layers to GPU
#   n-ctx        = context window in tokens
#   n-predict       = max tokens to generate (-1 = unlimited)
#   temperature     = sampling temperature
#   top-k           = top-k sampling
#   top-p           = top-p (nucleus) sampling
#   repeat-penalty  = presence/repetition penalty
#   reasoning-format = none disables Qwen3.5 chain-of-thought tokens
# ============================================================


# ──────────────────────────────────────────────────────────
# Brain — Deep coding assistant (VS Code / Cursor chat)
# Largest model. Stays loaded until evicted by another request.
# Source: unsloth/Qwen3.5-35B-A3B-GGUF (UD-IQ4_NL quant)
# VRAM: ~17.8 GB
# ──────────────────────────────────────────────────────────
[brain]
model           = /srv/models/unsloth/Qwen3.5-35B-A3B-GGUF/Qwen3.5-35B-A3B-UD-IQ4_NL.gguf
alias           = brain
n-gpu-layers    = -1
ctx-size        = 32768
n-predict       = -1
temperature     = 0.2
top-k           = 10
top-p           = 0.9
reasoning-format = none
ubatch-size     = 2048
cache-type-v    = q8_0


