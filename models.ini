n-gpu-layers    = -1
ctx-size        = 96000
n-predict       = -1
temperature     = 0.65
top-k           = 20
top-p           = 0.95
min-p           = 0.0
repeat-penalty  = 1.05
presence-penalty = 0.0
ubatch-size     = 1024
batch-size      = 2048
cache-type-k    = q8_0
cache-type-v    = q8_0
; no-prefill-assistant = 1
