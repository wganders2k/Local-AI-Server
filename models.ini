# datasets (lora-training/cut_context.py) or judging the topic eval
# (topic_eval.py) would take days instead of hours. Temperature 0 so a
# label is reproducible, and a small context — prompts are one conversation.
# n-predict is only a ceiling; callers set max_tokens for what they ask for.
