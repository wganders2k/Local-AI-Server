# ============================================================
# llama-server Model Presets — Swappable Slot (:11434)
# ============================================================
# Used with: llama-server --models-preset models.ini
#
# Each [section] defines a named model available via the router.
# The router loads a model into VRAM on first request and evicts
# it when a different model is requested (swap-on-demand).
#
# Model files live at: /models/<publisher>/<model>/filename.gguf
# Download all GGUFs with: make models-download
#
# Parameter reference:
#   model           = path to GGUF file
#   alias           = name used in API requests (model field)
#   n_gpu_layers    = -1 to offload all layers to GPU
#   ctx_size        = context window in tokens
#   n_predict       = max tokens to generate (-1 = unlimited)
#   temperature     = sampling temperature
#   top_k           = top-k sampling
#   top_p           = top-p (nucleus) sampling
#   repeat_penalty  = presence/repetition penalty
#   reasoning_format = none disables Qwen3.5 chain-of-thought tokens
# ============================================================


# ──────────────────────────────────────────────────────────
# Brain — Deep coding assistant (VS Code / Cursor chat)
# Largest model. Stays loaded until evicted by another request.
# Source: unsloth/Qwen3.5-35B-A3B-GGUF (UD-IQ4_NL quant)
# VRAM: ~17.8 GB
# ──────────────────────────────────────────────────────────
[brain]
model           = /models/unsloth/Qwen3.5-35B-A3B-GGUF/Qwen3.5-35B-A3B-UD-IQ4_NL.gguf
alias           = brain
n_gpu_layers    = -1
ctx_size        = 40960
n_predict       = -1
temperature     = 0.2
top_k           = 10
top_p           = 0.9
reasoning_format = none


# ──────────────────────────────────────────────────────────
# Mimic (base template) — Discord persona mimicry
# Zero-refusal uncensored base. Per-member personas share
# this same GGUF — only the system prompt differs.
# Source: HauhauCS/Qwen3.5-35B-A3B-Uncensored (IQ4_XS quant)
# VRAM: ~18 GB
#
