# ============================================================
# llama-server Model Presets — Swappable Slot (:11434)
# ============================================================
# Used with: llama-server --models-preset models.ini
#
# Each [section] defines a named model available via the router.
# The router loads a model into VRAM on first request and evicts
# it when a different model is requested (swap-on-demand).
#
# Model files live at: /srv/models/<publisher>/<model>/filename.gguf
# Download all GGUFs with: make models-download
#
# Parameter reference:
#   model           = path to GGUF file
#   alias           = name used in API requests (model field)
#   n-gpu-layers    = -1 to offload all layers to GPU
#   ctx-size        = context window in tokens
#   n-predict       = max tokens to generate (-1 = unlimited)
#   temperature     = sampling temperature
#   top-k           = top-k sampling
#   top-p           = top-p (nucleus) sampling
#   repeat-penalty  = presence/repetition penalty
#   reasoning-format = none disables Qwen3.5 chain-of-thought tokens
# ============================================================


# ──────────────────────────────────────────────────────────
# Brain — Deep coding assistant (VS Code / Cursor chat)
# Largest model. Stays loaded until evicted by another request.
# Source: unsloth/Qwen3.6-35B-A3B-GGUF (UD-IQ4_NL quant)
# VRAM: ~18 GB
# ──────────────────────────────────────────────────────────
[qwen3.6-35b-a3b]
model           = /srv/models/unsloth/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-UD-IQ4_NL.gguf
alias           = qwen3.6-35b-a3b
n-gpu-layers    = -1
ctx-size        = 131072
n-predict       = -1
temperature     = 0.65
top-k           = 20
top-p           = 0.95
min-p           = 0.0
repeat-penalty  = 1.05
presence-penalty = 0.0
ubatch-size     = 1024
batch-size      = 2048
cache-type-k    = q8_0
cache-type-v    = q8_0
; no-prefill-assistant = 1
chat-template-kwargs = {"preserve_thinking": true}

[qwen3.6-27b]
model           = /srv/models/unsloth/Qwen3.6-27B-GGUF/Qwen3.6-27B-Q4_K_M.gguf
alias           = qwen3.6-27b
n-gpu-layers    = -1
ctx-size        = 96000
n-predict       = -1
temperature     = 0.65
top-k           = 20
top-p           = 0.95
min-p           = 0.0
repeat-penalty  = 1.05
presence-penalty = 0.0
ubatch-size     = 1024
batch-size      = 2048
cache-type-k    = q8_0
cache-type-v    = q8_0
; no-prefill-assistant = 1
chat-template-kwargs = {"preserve_thinking": true}

[qwen3.6-27b-u]
model           = /srv/models/DavidAU/Qwen3.6-27B-Heretic-Uncensored-FINETUNE-NEO-CODE-Di-IMatrix-MAX-GGUF/Qwen3.6-27B-NEO-CODE-HERE-2T-OT-Q4_K_M.gguf
# Vision: the /lore agent (discord-bot AGENT_MODEL) describes images posted in
# a lore thread itself, with no swap to a captioner and back. The projector is
# the finetune author's own (qwen3vl_merger), from the same repo. Measured
# 2026-11-12: this preset holds 21.25 GB with it, ~3.3 GB short of the 24 GB
# card (the always-resident 2.2 GB autocomplete server was removed the same
# day) — measure again before raising ctx-size.
mmproj          = /srv/models/DavidAU/Qwen3.6-27B-Heretic-Uncensored-FINETUNE-NEO-CODE-Di-IMatrix-MAX-GGUF/mmproj-F16.gguf
alias           = qwen3.6-27b-u
n-gpu-layers    = -1
ctx-size        = 96000
n-predict       = -1
temperature     = 0.65
top-k           = 20
top-p           = 0.95
min-p           = 0.0
repeat-penalty  = 1.05
presence-penalty = 0.0
ubatch-size     = 1024
batch-size      = 2048
cache-type-k    = q8_0
cache-type-v    = q8_0
; no-prefill-assistant = 1
chat-template-kwargs = {"preserve_thinking": true}

# ──────────────────────────────────────────────────────────
# Judge — qwen3.6-27b-u as a labeller, not a chat model.
# Thinking off: at ~800 reasoning tokens a call, labelling the persona
# datasets (lora-training/cut_context.py) or judging the topic eval
# (topic_eval.py) would take days instead of hours. Temperature 0 so a
# label is reproducible, and a small context — prompts are one conversation.
# n-predict is only a ceiling; callers set max_tokens for what they ask for.
# Callers ask for JSON (response_format json_schema), so the answer is
# constrained to the schema, never prose.
# ──────────────────────────────────────────────────────────
[qwen3.6-27b-judge-u]
model           = /srv/models/DavidAU/Qwen3.6-27B-Heretic-Uncensored-FINETUNE-NEO-CODE-Di-IMatrix-MAX-GGUF/Qwen3.6-27B-NEO-CODE-HERE-2T-OT-Q4_K_M.gguf
alias           = qwen3.6-27b-judge-u
n-gpu-layers    = -1
ctx-size        = 16384
n-predict       = 512
temperature     = 0.0
cache-type-k    = q8_0
cache-type-v    = q8_0
chat-template-kwargs = {"enable_thinking": false}

[gemma4-31b]
model           = /srv/models/unsloth/gemma-4-31B-it-GGUF/gemma-4-31B-it-Q4_K_M.gguf
alias           = gemma4-31b
n-gpu-layers    = -1
ctx-size        = 65536
n-predict       = -1
temperature     = 1.0
top-k           = 64
top-p           = 0.95
min-p           = 0.0
repeat-penalty  = 1.0
presence-penalty = 0.0
ubatch-size     = 1024
batch-size      = 2048
cache-type-k    = q8_0
cache-type-v    = q8_0

# ──────────────────────────────────────────────────────────
# Mimic — Discord persona mimicry (per-member LoRA adapters)
# One shared base; each persona is this base plus its own GGUF
# LoRA adapter (tens of MB), trained by lora-training/ and
# written by `make train-export-latest` to /srv/models/lora/.
#
# The adapter only works over the exact weights it was trained
# on: lora-training/configs/mimic_gemma4_12b.yaml trains on
# culturerevolt/gemma-4-12b-heretic-abliterated, and this GGUF
# is the same author's quant of those weights.
# Source: culturerevolt/gemma-4-12b-heretic-abliterated-GGUF (Q4_K_M)
# VRAM: ~9 GB
#
# [gemma4-12b-u] is the bare base on its own. /mimic never uses it:
# [gemma4-12b-mimic-u] with no adapter applied is the same model without a
# swap, and is what the chat controller and `train-sample base` use.
# ──────────────────────────────────────────────────────────
[gemma4-12b-u]
model           = /srv/models/culturerevolt/gemma-4-12b-heretic-abliterated-GGUF/gemma-4-12b-heretic-Q4_K_M.gguf
alias           = gemma4-12b-u
n-gpu-layers    = -1
ctx-size        = 32768
n-predict       = 512
temperature     = 1.0
top-k           = 64
top-p           = 0.95
min-p           = 0.0
repeat-penalty  = 1.0
cache-type-k    = q8_0
cache-type-v    = q8_0
# Thinking off, and it must stay in step with chat_template_kwargs in
# lora-training/configs/mimic_gemma4_12b.yaml: the adapter is trained on
# prompts rendered this way, and on any other rendering it degrades.
chat-template-kwargs = {"enable_thinking": false}

# Every persona adapter on one loaded base, none applied until a request
# picks one: {"lora": [{"id": i, "scale": s}, ...]} in the request body.
# A speaker change in /mimic, /mimic-chat and lore's simulate_conversation
# then costs nothing. This is the ONLY place a persona is wired to serving.
#
# The order of this list IS the adapter id. Nothing copies it: the bot and
# `make train-sample` read it back from the proxy's /v1/models at startup.
# A persona needs its roster entry too (personas.json) to be offered.
#
# Every file listed must exist: llama-server waits forever on a missing
# adapter, and they load together, so one missing file hangs /mimic for
# every persona. `make train-export-latest` warns when one is missing.
[gemma4-12b-mimic-u]
model           = /srv/models/culturerevolt/gemma-4-12b-heretic-abliterated-GGUF/gemma-4-12b-heretic-Q4_K_M.gguf
lora            = /srv/models/lora/mimic_user1-lora.gguf,/srv/models/lora/mimic_user2-lora.gguf,/srv/models/lora/mimic_user3-lora.gguf,/srv/models/lora/mimic_user4-lora.gguf,/srv/models/lora/mimic_user5-lora.gguf,/srv/models/lora/mimic_user6-lora.gguf,/srv/models/lora/mimic_user7-lora.gguf
lora-init-without-apply = true
# Vision: the bot captions images on this resident base with no adapter
# applied (discord-bot/vision.py), so a caption costs no swap. The projector is
# type `gemma4uv`: llama.cpp build 8925 rejected it and then hung every request
# for the preset, so it needs b11977 or later (llama-swappable's pinned image).
# The projector only touches image tokens; text prompts render as before.
mmproj          = /srv/models/culturerevolt/gemma-4-12b-heretic-abliterated-GGUF/gemma-4-12b-heretic-mmproj-f16.gguf
alias           = gemma4-12b-mimic-u
n-gpu-layers    = -1
ctx-size        = 32768
n-predict       = 512
temperature     = 1.0
top-k           = 64
top-p           = 0.95
min-p           = 0.0
repeat-penalty  = 1.0
cache-type-k    = q8_0
cache-type-v    = q8_0
chat-template-kwargs = {"enable_thinking": false}

# One adapter that is not live yet, to judge against a live one:
#   make train-export-latest PERSONA=mimic_userN CANDIDATE=1
#   make train-sample PERSONA=mimic_userN MODELS="mimic_userN candidate" ARGS=--blind
# Applied per request like [gemma4-12b-mimic-u], at the same scale, so the A/B
# compares adapters rather than scales. Only requested by train-sample, which
# refuses while candidate-lora.gguf does not exist.
[gemma4-12b-mimic-candidate-u]
model           = /srv/models/culturerevolt/gemma-4-12b-heretic-abliterated-GGUF/gemma-4-12b-heretic-Q4_K_M.gguf
lora            = /srv/models/lora/candidate-lora.gguf
lora-init-without-apply = true
# Same projector as [gemma4-12b-mimic-u], once enabled, so an A/B compares adapters only.
mmproj          = /srv/models/culturerevolt/gemma-4-12b-heretic-abliterated-GGUF/gemma-4-12b-heretic-mmproj-f16.gguf
alias           = gemma4-12b-mimic-candidate-u
n-gpu-layers    = -1
ctx-size        = 32768
n-predict       = 512
temperature     = 1.0
top-k           = 64
top-p           = 0.95
min-p           = 0.0
repeat-penalty  = 1.0
cache-type-k    = q8_0
cache-type-v    = q8_0
chat-template-kwargs = {"enable_thinking": false}


