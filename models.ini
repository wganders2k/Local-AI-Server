# ──────────────────────────────────────────────────────────
# Mimic — Discord persona mimicry (per-member LoRA adapters)
# One shared base; each persona is this base plus its own GGUF
# LoRA adapter (tens of MB), trained by lora-training/ and
# written by `make train-export` to /srv/models/lora/.
#
# The adapter only works over the exact weights it was trained
# on: lora-training/configs/mimic_gemma4_12b.yaml trains on
# culturerevolt/gemma-4-12b-heretic-abliterated, and this GGUF
# is the same author's quant of those weights.
# Source: culturerevolt/gemma-4-12b-heretic-abliterated-GGUF (Q4_K_M)
# VRAM: ~9 GB
#
# [mimic-base] is the bare base — the control that
# `make train-sample` compares each persona against.
# ──────────────────────────────────────────────────────────
[mimic-base]
model           = /srv/models/culturerevolt/gemma-4-12b-heretic-abliterated-GGUF/gemma-4-12b-heretic-Q4_K_M.gguf
alias           = mimic-base
n-gpu-layers    = -1
ctx-size        = 32768
n-predict       = 512
temperature     = 1.0
top-k           = 64
top-p           = 0.95
min-p           = 0.0
repeat-penalty  = 1.0
cache-type-k    = q8_0
cache-type-v    = q8_0
# Thinking off, and it must stay in step with chat_template_kwargs in
# lora-training/configs/mimic_gemma4_12b.yaml: the adapter is trained on
# prompts rendered this way, and on any other rendering it degrades.
chat-template-kwargs = {"enable_thinking": false}

# One section per trained persona. Each needs its adapter written
# by `make train-export PERSONA=mimic_userN` and its alias in
# MIMIC_PERSONAS in discord-bot/config.py.
[mimic_user1]
model           = /srv/models/culturerevolt/gemma-4-12b-heretic-abliterated-GGUF/gemma-4-12b-heretic-Q4_K_M.gguf
lora            = /srv/models/lora/mimic_user1-lora.gguf
alias           = mimic_user1
n-gpu-layers    = -1
ctx-size        = 32768
n-predict       = 512
temperature     = 1.0
top-k           = 64
top-p           = 0.95
min-p           = 0.0
repeat-penalty  = 1.0
cache-type-k    = q8_0
cache-type-v    = q8_0
chat-template-kwargs = {"enable_thinking": false}

