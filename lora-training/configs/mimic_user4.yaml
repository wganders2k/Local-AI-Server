# Mimic persona mimic_user4: the recipe in mimic_gemma4_12b.yaml, on this persona's data.
extends: mimic_gemma4_12b.yaml

dataset:
  path: /archive/training/mimic_user4/train.jsonl
  eval_path: /archive/training/mimic_user4/eval.jsonl

# v1 (lora-outputs/mimic_user4) trained with raw URLs in the data, snowflake ids and all.
output_dir: /home/peacow/lora-outputs/mimic_user4-v2

# ~1.2k examples is ~72 steps per epoch, so two epochs and a tighter eval cadence.
training:
  epochs: 2
  eval_steps: 50
