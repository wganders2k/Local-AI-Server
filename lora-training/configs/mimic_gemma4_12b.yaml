# Mimic persona recipe — QLoRA on Gemma 4 12B (abliterated). Not a run on its
# own: each configs/mimic_userN.yaml `extends:` this and adds its dataset,
# output_dir and any overrides (train_worker.load_config merges them).
#
# The datasets are built from the roster by `make train-datasets`, and the base
# must be fetched before submitting, so a 24 GB download never happens while
# holding the GPU lease:
#   make train-fetch MODEL=culturerevolt/gemma-4-12b-heretic-abliterated
#
# The base has to be the exact weights llama-server serves the adapter over —
# culturerevolt/gemma-4-12b-heretic-abliterated-GGUF, same author, same weights.
# A LoRA applied to a different base loads without complaint and produces mush.

model: culturerevolt/gemma-4-12b-heretic-abliterated

# 4-bit is what makes a 12B with a 262k vocabulary fit beside the CUDA context
# and the logits. bf16 weights alone would be ~24 GB.
load_in_4bit: true
gradient_checkpointing: true

# Rendered into the training prompts, so it must match how the persona is
# served: [gemma4-12b-mimic-u] in models.ini sets the same kwargs. Thinking
# off — a persona reply is one short line and has nothing to reason about.
chat_template_kwargs:
  enable_thinking: false

dataset:
  # Eval is a forward pass over every row each `eval_steps`; capping it keeps
  # one evaluation to a minute or two rather than eating a whole idle window.
  eval_limit: 300

# No output_dir here: every persona sets its own. One directory per run, never
# reused — the worker resumes from the newest complete checkpoint it finds
# there, so a finished run's directory would make a new submission "resume" at
# its last step. `make train-queue` ignores output_dir and gives each run its
# own lora-outputs/<persona>-<job>; a persona's output_dir is for a plain
# `make train-submit`.

# Long enough that saving (adapter + 8-bit optimizer state) is a small fraction
# of the window, short enough that a preemption costs at most this much work.
checkpoint_minutes: 15
keep_checkpoints: 2

lora:
  r: 32
  alpha: 64
  dropout: 0.0
  # A regex, not a list: Gemma 4 is multimodal, and a bare suffix list would
  # also match projections outside the language model. Some layers share K and
  # V (attention_k_eq_v) and have no v_proj — PEFT skips what does not exist.
  target_modules: '.*language_model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)'

training:
  epochs: 1
  batch_size: 1          # the 262k-vocab logits dominate activation memory
  grad_accum: 16
  learning_rate: 2.0e-4
  # 24-turn contexts put p95 near 900 tokens; at 1024 the trainer silently
  # dropped ~1,000 examples whose reply fell past the cap. 2048 keeps all but
  # a handful, costs ~1 GB more VRAM and ~9% more time (measured 2026-11-06).
  max_seq_length: 2048
  logging_steps: 10
  eval_steps: 200
  seed: 42
