# Experiment (2026-11-10): does varying context length help personas follow the
# newest line? mimic_user2's recipe, system prompt and examples, with each
# training example's context cut to the last k turns, k uniform in [4, 24].
# eval.jsonl keeps full contexts, so eval_loss compares directly with
# mimic_user2-20261106-2236's 3.403. Judge with:
#   make train-export-latest PERSONA=mimic_user2 RUN=/home/peacow/lora-outputs/<this run> CANDIDATE=1
#   make train-sample PERSONA=mimic_user2 MODELS="mimic_user2 candidate" ARGS=--blind
extends: mimic_user2.yaml

dataset:
  path: /archive/training/mimic_user2-randctx/train.jsonl
  eval_path: /archive/training/mimic_user2-randctx/eval.jsonl

output_dir: /home/peacow/lora-outputs/mimic_user2-randctx
