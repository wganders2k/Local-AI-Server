# Mimic persona mimic_user7: the recipe in mimic_gemma4_12b.yaml, on this persona's data.
extends: mimic_gemma4_12b.yaml

dataset:
  path: /archive/training/mimic_user7/train.jsonl
  eval_path: /archive/training/mimic_user7/eval.jsonl

# v1 (lora-outputs/mimic_user7) trained with raw URLs in the data, snowflake ids and all.
output_dir: /home/peacow/lora-outputs/mimic_user7-v2

# ~250 examples is ~15 steps per epoch, so three epochs and a tighter eval cadence.
training:
  epochs: 3
  eval_steps: 25
