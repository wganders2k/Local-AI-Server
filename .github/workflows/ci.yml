# Lint + per-service unit tests on GitHub-hosted runners. CI only: deploys stay
# a manual `make pull` on the box, so nothing here holds credentials or reaches
# the server.
#
# Runs the same thing as `make lint` / `make test` locally.

name: CI

on:
  push:
    branches: [main]
  # pull_request, never pull_request_target: the repo is public, and fork code
  # must not run with a write token.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Also pinned in the Makefile (RUFF_VERSION) — bump both together.
      - run: pip install ruff==0.17.3
      - run: ruff check --output-format=github .

  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      # One broken service should not hide the state of the others.
      fail-fast: false
      # Each service on the interpreter its image ships. Keep the service list
      # in step with TEST_SERVICES in the Makefile; rag has no tests.
      matrix:
        include:
          - service: arbiter          # python:3.12-slim
            python: "3.12"
          - service: proxy            # python:3.12-slim
            python: "3.12"
          - service: discord-bot      # python:3.11-slim
            python: "3.11"
          - service: history-service  # python:3.11-slim
            python: "3.11"
          - service: lora-training    # pytorch/pytorch:2.9.0-cuda12.8-cudnn9-runtime ships 3.11.14
            python: "3.11"
    defaults:
      run:
        # The service's own pytest.ini (testpaths, pythonpath, asyncio_mode)
        # applies only from its directory.
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q
