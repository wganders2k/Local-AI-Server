services:
  # ──────────────────────────────────────────────────────────
  # llama-server — Permanent slot (:11435)
  # Hosts the autocomplete model (Qwen3.5-2B IQ4_NL) forever.
  # Never swapped. Loaded at startup, stays resident.
  # ──────────────────────────────────────────────────────────
  llama-permanent:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    ports:
      - 11435:8080
    volumes:
      - ${MODELS_DIR:-/srv/models}:/models:ro
    command: > #--model /models/unsloth/Qwen3.5-2B-GGUF/Qwen3.5-2B-IQ4_NL.gguf 
      --model /models/ggml-org/Qwen2.5-Coder-1.5B-Q8_0-GGUF/qwen2.5-coder-1.5b-q8_0.gguf
      --alias autocomplete --host 0.0.0.0 --port 8080 --n-gpu-layers -1 --ctx-size 4096
      --n-predict 256 -fa on --cache-type-k q8_0 --parallel 4 --log-prefix
      --temp 0.7 --top-p 0.9 --top-k 40 --repeat-penalty 1.1
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # ──────────────────────────────────────────────────────────
  # llama-server — Swappable slot (:11434)
  # Router mode: hosts all non-autocomplete models.
  # Loads a model on first request, evicts when a different
  # model is requested. The proxy serialises access via lock.
  # ──────────────────────────────────────────────────────────
  llama-swappable:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    ports:
      - 11434:8080
    volumes:
      - ${MODELS_DIR:-/srv/models}:/srv/models:ro
      - /home/peacow/local-ai-server/models.ini:/models.ini:ro
    command: >
      --models-preset /models.ini --models-max 1 --host 0.0.0.0 --port 8080 -fa
      on --parallel 1 --log-prefix --threads-batch 12
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # ──────────────────────────────────────────────────────────
  # FastAPI Orchestration Proxy (:11436)
  # Routes requests to the correct llama-server instance.
  # Serialises access to the swappable slot via asyncio.Lock.
  # Speaks OpenAI-compatible API on both sides.
  # ──────────────────────────────────────────────────────────
  proxy:
    build: ./proxy
    restart: unless-stopped
    ports:
      - 11436:11436
    depends_on:
      llama-permanent:
        condition: service_healthy
      llama-swappable:
        condition: service_healthy
    environment:
      - LLAMA_PERMANENT=http://llama-permanent:8080
      - LLAMA_SWAPPABLE=http://llama-swappable:8080
      - MODELS_INI_PATH=/models.ini
    volumes:
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.580.126.09:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
      - /home/peacow/local-ai-server/models.ini:/models.ini:ro
      - /home/peacow/local-ai-server/system_prompts.ini:/system_prompts.ini:ro
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:11436/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  # ──────────────────────────────────────────────────────────
  # Discord Bot
  # Mention routing, typing indicators, lore+mimic chain.
  # ──────────────────────────────────────────────────────────
  # discord-bot:
  #   build: ./discord-bot
  #   restart: unless-stopped
  #   depends_on:
  #     proxy:
  #       condition: service_healthy
  #     chromadb:
  #       condition: service_started
  #   environment:
  #     - DISCORD_TOKEN=${DISCORD_TOKEN}
  #     - PROXY_URL=http://proxy:11436
  #     - CHROMA_HOST=chromadb
  #     - CHROMA_PORT=8000
  #     - MAX_QUEUE_DEPTH=${MAX_QUEUE_DEPTH:-3}
  #     - RATE_LIMIT_PER_USER=${RATE_LIMIT_PER_USER:-5}
  #     - TYPING_INDICATOR_INTERVAL=${TYPING_INDICATOR_INTERVAL:-5}
  #     - LORE_TOP_K=${LORE_TOP_K:-5}

  # ──────────────────────────────────────────────────────────
  # Open WebUI (:3000)
  # Self-hosted chat UI. Supports local model via proxy
  # and Claude via Anthropic API key (set ANTHROPIC_API_KEY).
  # No sidecar needed — uses built-in SQLite database.
  # First user to register becomes admin.
  # ──────────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - 3000:8080
    depends_on:
      proxy:
        condition: service_healthy
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://proxy:11436/v1
      - OPENAI_API_KEY=local
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=
      - HF_TOKEN=${HF_TOKEN:-}
      - DEFAULT_USER_ROLE=pending
  # ──────────────────────────────────────────────────────────
  # RAG Service
  # Handles Discord history ingestion and lore retrieval.
  # CPU-only — no VRAM impact.
  # Reads JSONL history files produced by history-service.
  # ──────────────────────────────────────────────────────────
  # rag-service:
  #   build: ./rag
  #   restart: unless-stopped
  #   environment:
  #     - CHROMA_HOST=chromadb
  #     - CHROMA_PORT=8000
  #   depends_on:
  #     - chromadb
  #   volumes:
  #     - history_data:/history:ro    # Read-only access to JSONL history files

  # ──────────────────────────────────────────────────────────
  # ChromaDB
  # Vector store for lore embeddings.
  # CPU-only — no VRAM impact.
  # ──────────────────────────────────────────────────────────
  # chromadb:
  #   image: chromadb/chroma:latest
  #   restart: unless-stopped
  #   volumes:
  #     - chroma_data:/chroma/chroma

  # ──────────────────────────────────────────────────────────
  # History Service
  # Background service: per-user Discord message history
  # collection (JSONL) + LoRA retraining trigger.
  # Not in the inference hot path — runs on a schedule.
  # Phase 2: history collection only (TRAINING_TRIGGER_ENABLED=false)
  # Phase 3: enable training trigger (TRAINING_TRIGGER_ENABLED=true)
  # ──────────────────────────────────────────────────────────
  # history-service:
  #   build: ./history-service
  #   restart: unless-stopped
  #   depends_on:
  #     proxy:
  #       condition: service_healthy
  #   environment:
  #     - DISCORD_TOKEN=${DISCORD_TOKEN}
  #     - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
  #     - PROXY_URL=http://proxy:11436
  #     - LLAMA_SWAPPABLE=http://llama-swappable:8080
  #     - RETRAIN_THRESHOLD=${RETRAIN_THRESHOLD:-200}
  #     - INCREMENTAL_PULL_INTERVAL=${INCREMENTAL_PULL_INTERVAL:-15}
  #     - FULL_PULL_CRON=${FULL_PULL_CRON:-"0 3 1 * *"}
  #     - TRAINING_WINDOW_START=${TRAINING_WINDOW_START:-3}
  #     - TRAINING_WINDOW_END=${TRAINING_WINDOW_END:-6}
  #     - TRAINING_TRIGGER_ENABLED=${TRAINING_TRIGGER_ENABLED:-false}  # set true in Phase 3
  #   volumes:
  #     - history_data:/app/data
  #     - lora_outputs:/app/lora-outputs
  #     - ./models.ini:/models.ini         # Preset config for post-training re-registration
  #     - ./lora-training:/lora-training:ro  # Training scripts (read-only mount)
  #     - ${MODELS_DIR:-/srv/models}:/models  # Model storage for LoRA-merged GGUF output

  # ──────────────────────────────────────────────────────────
  # Named volumes
  # All persistent data lives here. Survives container restarts
  # and rebuilds. Use `make nuke` to wipe everything (destructive).
  # Note: GGUF model files are NOT in a named volume — they live
  # on the host at MODELS_DIR (default: /srv/models) and are bind-
  # mounted read-only. This means `make nuke` does NOT delete
  # downloaded model weights.
  # ──────────────────────────────────────────────────────────
volumes:
  open_webui_data: null
  chroma_data: null
  history_data: null
  lora_outputs: null
networks: {}
