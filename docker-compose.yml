services:
  # ──────────────────────────────────────────────────────────
  # llama-server — Permanent slot (:11435)
  # Hosts the autocomplete model (Qwen3.5-2B IQ4_NL) forever.
  # Never swapped. Loaded at startup, stays resident.
  # ──────────────────────────────────────────────────────────
  llama-permanent:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    profiles: ["autocomplete"]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    ports:
      - 11435:8080
    volumes:
      - ${MODELS_DIR:-/srv/models}:/models:ro
    command: > #--model /models/unsloth/Qwen3.5-2B-GGUF/Qwen3.5-2B-IQ4_NL.gguf 
      --model /models/ggml-org/Qwen2.5-Coder-1.5B-Q8_0-GGUF/qwen2.5-coder-1.5b-q8_0.gguf
      --alias autocomplete --host 0.0.0.0 --port 8080 --n-gpu-layers -1 --ctx-size 4096
      --n-predict 256 -fa on --cache-type-k q4_0 --cache-type-v q4_0 --parallel 3 --log-prefix
      --temp 0.7 --top-p 0.9 --top-k 40 --repeat-penalty 1.1
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # ──────────────────────────────────────────────────────────
  # llama-server — Swappable slot (:11434)
  # Router mode: hosts all non-autocomplete models.
  # Loads a model on first request, evicts when a different
  # model is requested. The proxy serialises access via lock.
  # ──────────────────────────────────────────────────────────
  llama-swappable:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    ports:
      - 11434:8080
    volumes:
      - ${MODELS_DIR:-/srv/models}:/srv/models:ro
      - /home/peacow/local-ai-server/models.ini:/models.ini:ro
    command: >
      --models-preset /models.ini --models-max 1 --host 0.0.0.0 --port 8080 -fa
      on --parallel 1 --log-prefix --threads-batch 12 --jinja
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # ──────────────────────────────────────────────────────────
  # LoRA trainer
  # Started and stopped by the arbiter, never by compose. The `managed` profile
  # is what enforces that: `docker compose up -d` skips it entirely, so it can
  # only ever reach the GPU through the scheduler. Without the profile a plain
  # `up` would hand it 16 GB behind the arbiter's back.
  # ──────────────────────────────────────────────────────────
  lora-trainer:
    build: ./lora-training
    container_name: lora-trainer
    # Never started by `docker compose up`, and never by the arbiter. A training
    # run is submitted by a human: `make train-submit CONFIG=configs/smoke.yaml`.
    profiles: ["managed"]
    # No restart policy, and none would help: Docker suppresses them for any
    # API-initiated stop or kill (measured — RestartCount=0 for both `always`
    # and `on-failure`), so a preempted container would stay down and the run
    # would be over. Nothing kills this container. supervisor.py inside it kills
    # the training process instead, which is what actually frees the VRAM, and
    # the container outlives every handover.
    restart: "no"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/cache/huggingface
      - ARBITER_URL=http://arbiter:11438
      # Must match the entry in arbiter/jobs.yaml, or this falls through to the
      # unknown-caller path and runs at the *top* priority instead of the bottom.
      - ARBITER_JOB_NAME=lora-trainer
      - TRAIN_CONFIG=${TRAIN_CONFIG:-configs/smoke.yaml}
    volumes:
      - /home/peacow/lora-outputs:/home/peacow/lora-outputs
      # Datasets and hyperparameters are the things that actually get tinkered
      # with between runs. Mounted so that editing one is an edit, not a rebuild
      # of a multi-GB CUDA image.
      # Absolute for the same reason as the discord-bot binds below.
      - /home/peacow/local-ai-server/lora-training/configs:/app/configs:ro
      # Model downloads survive preemption; without this every restart re-fetches
      # the base weights, which dwarfs the training it would have done.
      - /home/peacow/.cache/huggingface:/cache/huggingface
      # build_dataset.py reads the per-user archive (Tier 2, never written from
      # here) and writes the per-persona training sets (Tier 3) beside it. Both
      # hold real messages, which is why Tier 3 lives on the archive disk and
      # not under configs/ in the repo.
      - /mnt/storage_cold/array/DiscordArchive/archive:/archive/archive:ro
      - /mnt/storage_cold/array/DiscordArchive/training:/archive/training
      # The bot's persona template, so a training set's system prompt is the
      # one /mimic will send — not a copy that drifts from it.
      - /home/peacow/local-ai-server/discord-bot/prompts:/app/persona_prompts:ro
      # export_adapter.py writes GGUF adapters here; llama-swappable reads them
      # through its own /srv/models mount.
      - ${MODELS_DIR:-/srv/models}/lora:/srv/models/lora
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu

  # ──────────────────────────────────────────────────────────
  # GPU arbiter
  # The only component that decides who holds the card, and the only one that
  # can see it. Starts and stops job containers through docker-socket-proxy
  # rather than mounting the real socket, which is root-equivalent on the host —
  # that proxy's CONTAINERS+POST allowance is exactly this service's needs.
  # ──────────────────────────────────────────────────────────
  arbiter:
    build: ./arbiter
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    # GPU access for *measurement only*. `utility` injects NVML and nvidia-smi
    # but deliberately NOT `compute` — without the CUDA capability this container
    # cannot create a context, so it is structurally incapable of allocating a
    # byte of VRAM. The thing deciding whether anyone else has room must never
    # become a consumer itself.
    runtime: nvidia
    ports:
      - 127.0.0.1:11438:11438
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=utility
      - ARBITER_JOBS_PATH=/config/jobs.yaml
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      # GPU policy: who outranks whom and how much VRAM each job needs. The only
      # place either is expressed.
      - /home/peacow/local-ai-server/arbiter/jobs.yaml:/config/jobs.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11438/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ──────────────────────────────────────────────────────────
  # FastAPI Orchestration Proxy (:11436)
  # Routes requests to the correct llama-server instance.
  # Serialises access to the swappable slot via asyncio.Lock.
  # Speaks OpenAI-compatible API on both sides.
  # ──────────────────────────────────────────────────────────
  proxy:
    build: ./proxy
    restart: unless-stopped
    # No GPU access. The proxy asks the arbiter for the card and is told yes or
    # no; it has no reason to read the device, and giving it one would be a
    # second answer to a question the arbiter already owns.
    ports:
      - 11436:11436
    depends_on:
      llama-swappable:
        condition: service_healthy
      arbiter:
        condition: service_healthy
    environment:
      - LLAMA_PERMANENT=http://llama-permanent:8080
      - LLAMA_SWAPPABLE=http://llama-swappable:8080
      - ARBITER_URL=http://arbiter:11438
      # Which entry in arbiter/jobs.yaml this proxy is. It sends only this name;
      # its priority and what gets stopped for it are decided there. Must match a
      # job in that file — an unknown name is granted the top rank as a fallback,
      # which keeps the LLM answering but means it is running on invented policy.
      - ARBITER_JOB_NAME=llm
      - AUTOCOMPLETE_ENABLED=${AUTOCOMPLETE_ENABLED:-true}
      # Unload the resident model after this long idle, so the arbiter has real
      # headroom to offer a background job. Nothing else may unload llama-server's
      # models, which is why this stays here rather than moving to the arbiter.
      - IDLE_EVICT_ENABLED=${IDLE_EVICT_ENABLED:-true}
      - IDLE_EVICT_SECONDS=${IDLE_EVICT_SECONDS:-600}
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:11436/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  # ──────────────────────────────────────────────────────────
  # Discord Bot
  # Slash commands, typing indicators, lore+mimic chain.
  # ──────────────────────────────────────────────────────────
  discord-bot:
    build: ./discord-bot
    restart: unless-stopped
    depends_on:
      proxy:
        condition: service_healthy
      rag-service:
        condition: service_started
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - PROXY_URL=${PROXY_URL}
      - MAX_QUEUE_DEPTH=${MAX_QUEUE_DEPTH:-3}
      - RATE_LIMIT_PER_USER=${RATE_LIMIT_PER_USER:-5}
      - RAG_SERVICE_URL=http://rag-service:8001
      - RAG_ENABLED=${RAG_ENABLED:-true}
      - LORE_CONTEXT_PATH=${LORE_CONTEXT_PATH:-bot_context/lore/context.md}
    volumes:
      # Absolute, not ./relative. Compose resolves relative binds against the
      # directory it is invoked from, so recreating this stack through dockge
      # (-w /opt/dockge/stacks/local-ai-server) silently repoints these at an
      # empty directory — the bot then starts with no lore context and an empty
      # thread registry, and nothing in the logs says the mount moved.
      # Lore thread transcripts, the thread registry, and the server-specific
      # lore context file.
      # Out of the repo because they hold verbatim server history — every
      # excerpt a /lore run retrieved, and the real-name alias index — and they
      # belong with the archive that produced them, not in version control.
      # Lives on the mergerfs pool; the store's atomic temp+rename was verified
      # there. The registry moved here from discord-bot/data/ after a branch
      # switch deleted it from under this mount — runtime state must not live
      # inside the working tree.
      #
      # NOT mounted: /app/prompts. Those are the prompt templates, committed
      # code baked into the image — binding the host directory over them would
      # shadow the image's copies with the working tree.
      - /mnt/storage/array/DiscordArchive/bot_context:/app/bot_context
      # The mimic training data's names.json (member aliases) and each
      # persona's stats.json, so /mimic labels speakers, renders mentions and
      # renders its system prompt exactly as the adapters were trained — see
      # member_names.py. Read-only: the bot only ever reads what
      # lora-training/build_dataset.py and the hand-filled names file wrote.
      - /mnt/storage_cold/array/DiscordArchive/training:/archive/training:ro

  # ──────────────────────────────────────────────────────────
  # Open WebUI (:3000)
  # Self-hosted chat UI. Supports local model via proxy
  # and Claude via Anthropic API key (set ANTHROPIC_API_KEY).
  # No sidecar needed — uses built-in SQLite database.
  # First user to register becomes admin.
  # ──────────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - 3000:8080
    depends_on:
      proxy:
        condition: service_healthy
    volumes:
      # Bind mount (was named volume open_webui_data until 2026-11-04) so all
      # app state lives under /opt/appdata, where the nightly backup expects it.
      - /opt/appdata/open-webui:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://proxy:11436/v1
      - OPENAI_API_KEY=local
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=
      - HF_TOKEN=${HF_TOKEN:-}
      # New accounts land inactive and need promoting by an admin, so
      # authentik deciding *who* may sign in is still backed by a
      # second gate here.
      - DEFAULT_USER_ROLE=pending

      # ── SSO (authentik) ─────────────────────────────────────
      # WEBUI_URL is what open-webui uses to build the redirect, so
      # it must be the public hostname.
      - WEBUI_URL=https://chat.wganderbox.ca
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_PROVIDER_NAME=authentik
      - OAUTH_CLIENT_ID=${OPENWEBUI_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OPENWEBUI_CLIENT_SECRET}
      - OPENID_PROVIDER_URL=https://auth.wganderbox.ca/application/o/open-webui/.well-known/openid-configuration
      - OPENID_REDIRECT_URI=https://chat.wganderbox.ca/oauth/oidc/callback
      - OAUTH_SCOPES=openid email profile
      # Off now that linking is done. It was switched on for exactly
      # one login so the SSO identity could adopt the pre-existing
      # local admin account (same email) instead of being rejected.
      # open-webui wrote the authentik `sub` into user.oauth during
      # that login and now matches on it directly, so this flag is
      # never consulted again for an already-linked user.
      #
      # Turn it back on temporarily if you ever need to link another
      # existing local account — and off again afterwards, so a future
      # self-signup or federated source in authentik can't be used to
      # claim an account by asserting its email.
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=false
  # ──────────────────────────────────────────────────────────
  # RAG Service
  # Handles Discord history ingestion and lore retrieval.
  # CPU-only — no VRAM impact.
  # Reads JSONL history files produced by history-service.
  # ──────────────────────────────────────────────────────────
  rag-service:
    build: ./rag
    restart: unless-stopped
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - ARCHIVE_DIR=/archive
    depends_on:
      chromadb:
        condition: service_started
    volumes:
      - /mnt/storage_cold/array/DiscordArchive/archive:/archive:ro  # JSONL archive

  # ──────────────────────────────────────────────────────────
  # ChromaDB
  # Vector store for lore embeddings.
  # CPU-only — no VRAM impact.
  # ──────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      # Bind mount (was named volume chroma_data until 2026-11-04).
      - /opt/appdata/chroma:/data

  # ──────────────────────────────────────────────────────────
  # DiscordChatExporter — CLI-only, run via `docker compose run`
  # Exports raw Discord message history to JSON Lines format.
  # Not a long-running service. Invoked by history-service or
  # manually. Output lands on cold storage bind mount.
  # ──────────────────────────────────────────────────────────
  discord-chat-exporter:
    image: tyrrrz/discordchatexporter:latest
    profiles: ["manual"]  # Never auto-starts; requires explicit `docker compose run`
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
    volumes:
      - /mnt/storage_cold/array/DiscordArchive/raw:/out

  # ──────────────────────────────────────────────────────────
  # Docker Socket Proxy
  # Exposes a restricted Docker API socket so containers can
  # invoke `docker compose run` without full socket access.
  # Only allows container lifecycle + image pull operations.
  # ──────────────────────────────────────────────────────────
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Overrides the image's stock HAProxy template to raise the
      # client/server timeouts from 10m to 2h. `docker compose run` on the
      # DCE exporter holds POST /containers/{id}/wait open for the whole
      # export (observed up to ~35min), and at 10m the proxy severed that
      # connection mid-export, making `docker compose` report exit 125
      # ("unexpected EOF") even though the export itself had succeeded.
      # (SERVER_TIMEOUT/TIMEOUT_CLIENT env vars were tried first — this
      # image's entrypoint.sh never reads them, only ${BIND_CONFIG} via
      # sed, so they were silently doing nothing. See docker-socket-proxy/haproxy.cfg.template.)
      - ./docker-socket-proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    ports:
      - "127.0.0.1:2375:2375"
    environment:
      # Resource permissions (which Docker API namespaces are exposed)
      CONTAINERS: "1"   # /containers/* — list, inspect, create, start, stop, remove
      IMAGES: "1"       # /images/* — inspect + pull
      NETWORKS: "1"     # /networks/* — inspect (needed for compose network attachment)
      INFO: "1"         # /info — daemon info (read by `docker compose` on startup)
      # HTTP method permissions (default: only GET is allowed)
      POST: "1"         # Allow POST — container create/start, image pull
      DELETE: "1"       # Allow DELETE — container removal (--rm flag)

  # ──────────────────────────────────────────────────────────
  # History Service
  # Orchestrator: evaluates channels, triggers DCE exports,
  # merges raw JSONL into per-user archives, triggers LoRA training.
  # Port :11437. Not in the inference hot path.
  # ──────────────────────────────────────────────────────────
  history-service:
    build: ./history-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:11437:11437"
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - PROXY_URL=http://proxy:11436
      - IMAGE_CAPTION_ENABLED=${IMAGE_CAPTION_ENABLED:-false}
      - IMAGE_CAPTION_MODEL=${IMAGE_CAPTION_MODEL:-image-caption}
      - IMAGE_CAPTION_BATCH_SIZE=${IMAGE_CAPTION_BATCH_SIZE:-10}
      - IMAGE_CAPTION_WINDOW_START=${IMAGE_CAPTION_WINDOW_START:-3}
      - IMAGE_CAPTION_WINDOW_END=${IMAGE_CAPTION_WINDOW_END:-6}
      - IMAGE_CAPTION_MAX_FILE_SIZE_MB=${IMAGE_CAPTION_MAX_FILE_SIZE_MB:-10}
      - EXCLUDED_CHANNELS=${EXCLUDED_CHANNELS:-}
    volumes:
      - /mnt/storage_cold/array/DiscordArchive:/archive    # Cold storage bind mount
      - /home/peacow/local-ai-server/dce-compose.yml:/etc/dce-compose.yml:ro  # DCE compose config

  # ──────────────────────────────────────────────────────────
  # Prometheus + Grafana moved to the dockge "monitoring" stack
  # on 2026-11-04 (server-wide, not LLM-specific). Prometheus
  # scrapes the proxy at 192.168.2.55:11436/metrics; Grafana is
  # still on :3002. Config: ~/server-ops/monitoring (private).
  # ──────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────
  # Persistent data
  # No named volumes since 2026-11-04: Open WebUI and ChromaDB
  # state are bind mounts under /opt/appdata (open-webui, chroma),
  # GGUF model files live at MODELS_DIR (default: /srv/models),
  # bind-mounted read-only. `make nuke` touches none of these.
  # ──────────────────────────────────────────────────────────
networks: {}
