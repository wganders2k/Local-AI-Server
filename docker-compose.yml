services:

  # ──────────────────────────────────────────────────────────
  # llama-server — Permanent slot (:11435)
  # Hosts the autocomplete model (Qwen3.5-2B IQ4_NL) forever.
  # Never swapped. Loaded at startup, stays resident.
  # ──────────────────────────────────────────────────────────
  llama-permanent:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    ports:
      - "11435:8080"
    volumes:
      - ${MODELS_DIR:-/srv/models}:/models:ro
    command: >
      --model /models/unsloth/Qwen3.5-2B-GGUF/Qwen3.5-2B-IQ4_NL.gguf
      --alias autocomplete
      --host 0.0.0.0
      --port 8080
      --n-gpu-layers -1
      --ctx-size 4096
      --n-predict 256
      -fa on
      --cache-type-k q8_0
      --parallel 4
      --log-prefix
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ──────────────────────────────────────────────────────────
  # llama-server — Swappable slot (:11434)
  # Router mode: hosts all non-autocomplete models.
  # Loads a model on first request, evicts when a different
  # model is requested. The proxy serialises access via lock.
  # ──────────────────────────────────────────────────────────
  llama-swappable:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    ports:
      - "11434:8080"
    volumes:
      - ${MODELS_DIR:-/srv/models}:/srv/models:ro
      - ./models.ini:/models.ini:ro
    command: >
      --models-preset /models.ini
      --host 0.0.0.0
      --port 8080
      -fa on
      --cache-type-k q8_0
      --parallel 1
      --log-prefix
      --threads-batch 12
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ──────────────────────────────────────────────────────────
  # FastAPI Orchestration Proxy (:11436)
  # Routes requests to the correct llama-server instance.
  # Serialises access to the swappable slot via asyncio.Lock.
  # Speaks OpenAI-compatible API on both sides.
  # ──────────────────────────────────────────────────────────
  proxy:
    build: ./proxy
    restart: unless-stopped
    ports:
      - "11436:11436"
    depends_on:
      llama-permanent:
        condition: service_healthy
      llama-swappable:
        condition: service_healthy
    environment:
      - LLAMA_PERMANENT=http://llama-permanent:8080
      - LLAMA_SWAPPABLE=http://llama-swappable:8080
    volumes:
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.580.126.09:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11436/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

