  #     - ${MODELS_DIR:-/srv/models}:/models  # Model storage for LoRA-merged GGUF output

# ──────────────────────────────────────────────────────────
# Named volumes
# All persistent data lives here. Survives container restarts
# and rebuilds. Use `make nuke` to wipe everything (destructive).
# Note: GGUF model files are NOT in a named volume — they live
# on the host at MODELS_DIR (default: /srv/models) and are bind-
# mounted read-only. This means `make nuke` does NOT delete
# downloaded model weights.
# ──────────────────────────────────────────────────────────
volumes:
  librechat_uploads:      # LibreChat uploaded files
  librechat_mongo:        # LibreChat conversation history + settings
  chroma_data:            # ChromaDB lore embeddings
  history_data:           # Per-user JSONL message history + training state
  lora_outputs:           # Merged GGUF outputs from LoRA training
