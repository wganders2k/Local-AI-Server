services:
  # ──────────────────────────────────────────────────────────
  # llama-server — Permanent slot (:11435)
  # Hosts the autocomplete model (Qwen3.5-2B IQ4_NL) forever.
  # Never swapped. Loaded at startup, stays resident.
  # ──────────────────────────────────────────────────────────
  llama-permanent:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    profiles: ["autocomplete"]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    ports:
      - 11435:8080
    volumes:
      - ${MODELS_DIR:-/srv/models}:/models:ro
    command: > #--model /models/unsloth/Qwen3.5-2B-GGUF/Qwen3.5-2B-IQ4_NL.gguf 
      --model /models/ggml-org/Qwen2.5-Coder-1.5B-Q8_0-GGUF/qwen2.5-coder-1.5b-q8_0.gguf
      --alias autocomplete --host 0.0.0.0 --port 8080 --n-gpu-layers -1 --ctx-size 4096
      --n-predict 256 -fa on --cache-type-k q4_0 --cache-type-v q4_0 --parallel 3 --log-prefix
      --temp 0.7 --top-p 0.9 --top-k 40 --repeat-penalty 1.1
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # ──────────────────────────────────────────────────────────
  # llama-server — Swappable slot (:11434)
  # Router mode: hosts all non-autocomplete models.
  # Loads a model on first request, evicts when a different
  # model is requested. The proxy serialises access via lock.
  # ──────────────────────────────────────────────────────────
  llama-swappable:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    ports:
      - 11434:8080
    volumes:
      - ${MODELS_DIR:-/srv/models}:/srv/models:ro
      - /home/peacow/local-ai-server/models.ini:/models.ini:ro
    command: >
      --models-preset /models.ini --models-max 1 --host 0.0.0.0 --port 8080 -fa
      on --parallel 1 --log-prefix --threads-batch 12 --jinja
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # ──────────────────────────────────────────────────────────
  # FastAPI Orchestration Proxy (:11436)
  # Routes requests to the correct llama-server instance.
  # Serialises access to the swappable slot via asyncio.Lock.
  # Speaks OpenAI-compatible API on both sides.
  # ──────────────────────────────────────────────────────────
  proxy:
    build: ./proxy
    restart: unless-stopped
    ports:
      - 11436:11436
    depends_on:
      llama-swappable:
        condition: service_healthy
    environment:
      - LLAMA_PERMANENT=http://llama-permanent:8080
      - LLAMA_SWAPPABLE=http://llama-swappable:8080
      - MODELS_INI_PATH=/models.ini
      - GLANCES_URL=http://192.168.2.55:61208
      - AUTOCOMPLETE_ENABLED=${AUTOCOMPLETE_ENABLED:-true}
    volumes:
      - /home/peacow/local-ai-server/models.ini:/models.ini:ro
      - /home/peacow/local-ai-server/system_prompts.ini:/system_prompts.ini:ro
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:11436/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  # ──────────────────────────────────────────────────────────
  # Discord Bot
  # Slash commands, typing indicators, lore+mimic chain.
  # ──────────────────────────────────────────────────────────
  discord-bot:
    build: ./discord-bot
    restart: unless-stopped
    depends_on:
      proxy:
        condition: service_healthy
      rag-service:
        condition: service_started
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - PROXY_URL=${PROXY_URL}
      - MAX_QUEUE_DEPTH=${MAX_QUEUE_DEPTH:-3}
      - RATE_LIMIT_PER_USER=${RATE_LIMIT_PER_USER:-5}
      - TYPING_INDICATOR_INTERVAL=${TYPING_INDICATOR_INTERVAL:-5}
      - RAG_SERVICE_URL=http://rag-service:8001
      - LORE_TOP_K=${LORE_TOP_K:-5}
      - RAG_ENABLED=${RAG_ENABLED:-true}
    volumes:
      - ./discord-bot/data:/app/data  # Persistent thread registry

  # ──────────────────────────────────────────────────────────
  # Open WebUI (:3000)
  # Self-hosted chat UI. Supports local model via proxy
  # and Claude via Anthropic API key (set ANTHROPIC_API_KEY).
  # No sidecar needed — uses built-in SQLite database.
  # First user to register becomes admin.
  # ──────────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - 3000:8080
    depends_on:
      proxy:
        condition: service_healthy
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://proxy:11436/v1
      - OPENAI_API_KEY=local
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=
      - HF_TOKEN=${HF_TOKEN:-}
      - DEFAULT_USER_ROLE=pending
  # ──────────────────────────────────────────────────────────
  # RAG Service
  # Handles Discord history ingestion and lore retrieval.
  # CPU-only — no VRAM impact.
  # Reads JSONL history files produced by history-service.
  # ──────────────────────────────────────────────────────────
  rag-service:
    build: ./rag
    restart: unless-stopped
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - ARCHIVE_DIR=/archive
    depends_on:
      chromadb:
        condition: service_started
    volumes:
      - /mnt/storage_cold/array/DiscordArchive/archive:/archive:ro  # JSONL archive

  # ──────────────────────────────────────────────────────────
  # ChromaDB
  # Vector store for lore embeddings.
  # CPU-only — no VRAM impact.
  # ──────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma

  # ──────────────────────────────────────────────────────────
  # DiscordChatExporter — CLI-only, run via `docker compose run`
  # Exports raw Discord message history to JSON Lines format.
  # Not a long-running service. Invoked by history-service or
  # manually. Output lands on cold storage bind mount.
  # ──────────────────────────────────────────────────────────
  discord-chat-exporter:
    image: tyrrrz/discordchatexporter:latest
    profiles: ["manual"]  # Never auto-starts; requires explicit `docker compose run`
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
    volumes:
      - /mnt/storage_cold/array/DiscordArchive/raw:/out

  # ──────────────────────────────────────────────────────────
  # Docker Socket Proxy
  # Exposes a restricted Docker API socket so containers can
  # invoke `docker compose run` without full socket access.
  # Only allows container lifecycle + image pull operations.
  # ──────────────────────────────────────────────────────────
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"
    environment:
      # Resource permissions (which Docker API namespaces are exposed)
      CONTAINERS: "1"   # /containers/* — list, inspect, create, start, stop, remove
      IMAGES: "1"       # /images/* — inspect + pull
      NETWORKS: "1"     # /networks/* — inspect (needed for compose network attachment)
      INFO: "1"         # /info — daemon info (read by `docker compose` on startup)
      # HTTP method permissions (default: only GET is allowed)
      POST: "1"         # Allow POST — container create/start, image pull
      DELETE: "1"       # Allow DELETE — container removal (--rm flag)

  # ──────────────────────────────────────────────────────────
  # History Service
  # Orchestrator: evaluates channels, triggers DCE exports,
  # merges raw JSONL into per-user archives, triggers LoRA training.
  # Port :11437. Not in the inference hot path.
  # ──────────────────────────────────────────────────────────
  history-service:
    build: ./history-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:11437:11437"
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - PROXY_URL=http://proxy:11436
      - IMAGE_CAPTION_ENABLED=${IMAGE_CAPTION_ENABLED:-false}
      - IMAGE_CAPTION_MODEL=${IMAGE_CAPTION_MODEL:-image-caption}
      - IMAGE_CAPTION_BATCH_SIZE=${IMAGE_CAPTION_BATCH_SIZE:-10}
      - IMAGE_CAPTION_WINDOW_START=${IMAGE_CAPTION_WINDOW_START:-3}
      - IMAGE_CAPTION_WINDOW_END=${IMAGE_CAPTION_WINDOW_END:-6}
      - IMAGE_CAPTION_MAX_FILE_SIZE_MB=${IMAGE_CAPTION_MAX_FILE_SIZE_MB:-10}
    volumes:
      - /mnt/storage_cold/array/DiscordArchive:/archive    # Cold storage bind mount
      - /home/peacow/local-ai-server/dce-compose.yml:/etc/dce-compose.yml:ro  # DCE compose config
      - /home/peacow/local-ai-server/dce.env:/etc/dce.env:ro  # DCE needs DISCORD_TOKEN from dce.env

  # ──────────────────────────────────────────────────────────
  # Prometheus
  # Scrapes /metrics endpoint from the proxy service.
  # Exposed on port 9091 (9090 was already allocated).
  # ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - /home/peacow/local-ai-server/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"

  # ──────────────────────────────────────────────────────────
  # Grafana
  # Visualization layer for Prometheus metrics.
  # Exposed on port 3002 (3000 is used by Open WebUI, 3001 was already allocated).
  # Default login: admin / admin
  # ──────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

  # ──────────────────────────────────────────────────────────
  # Named volumes
  # All persistent data lives here. Survives container restarts
  # and rebuilds. Use `make nuke` to wipe everything (destructive).
  # Note: GGUF model files are NOT in a named volume — they live
  # on the host at MODELS_DIR (default: /srv/models) and are bind-
  # mounted read-only. This means `make nuke` does NOT delete
  # downloaded model weights.
  # ──────────────────────────────────────────────────────────
volumes:
  open_webui_data: null
  chroma_data: null
  history_data: null
  lora_outputs: null
  grafana_data: null
networks: {}
